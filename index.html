<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SOULVAULT — Card Game</title>
<style>
:root{
  --bg:#09080d;--panel:#12101a;--panel2:#181521;--gold:#d9b35a;
  --gold2:#f3d98b;--purple:#8b5cf6;--text:#f7f4ed;--muted:#a9a3b4;
  --line:#2b2635;--danger:#ef6a78;
}
*{box-sizing:border-box} html,body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif}
button,input{font:inherit} button{cursor:pointer}
.app{min-height:100vh;display:flex;flex-direction:column}
.topbar{height:68px;background:rgba(9,8,13,.94);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:24px;padding:0 28px;position:sticky;top:0;z-index:20;backdrop-filter:blur(12px)}
.logo{
  display:flex;
  align-items:center;
  width:500px;
}
.logo small{display:block;font-size:8px;letter-spacing:4px;color:var(--muted);font-weight:600;margin-top:-2px}
.nav{display:flex;gap:6px;overflow:auto}.nav button{border:0;background:transparent;color:var(--muted);padding:10px 14px;border-radius:10px}.nav button.active,.nav button:hover{background:var(--panel2);color:var(--gold2)}
.main{width:min(1400px,100%);margin:auto;padding:28px}
.hero{display:grid;grid-template-columns:1.3fr .7fr;gap:18px;margin-bottom:24px}
.heroBox,.statBox{background:linear-gradient(135deg,#17121f,#0f0d14);border:1px solid var(--line);border-radius:20px;padding:28px;position:relative;overflow:hidden}
.heroBox:after{content:"";position:absolute;width:280px;height:280px;border-radius:50%;right:-80px;top:-100px;background:radial-gradient(circle,rgba(139,92,246,.3),transparent 68%)}
.kicker{font-size:20px;letter-spacing:10px;color:var(--gold);font-weight:800}.hero h1{font-size:clamp(50px,10vw,70px);margin:8px 0}.hero p{color:var(--muted);max-width:620px;line-height:1.7;margin:0}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}.statBox{padding:18px}.statBox b{font-size:30px;display:block;color:var(--gold2)}.statBox span{color:var(--muted);font-size:12px}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}.search{flex:1;min-width:210px;background:var(--panel);border:1px solid var(--line);color:white;border-radius:12px;padding:12px 14px;outline:none}.filter{background:var(--panel);border:1px solid var(--line);color:var(--text);border-radius:12px;padding:11px 14px}
.primary{background:linear-gradient(135deg,#e3bd63,#9c6d1c);border:0;color:#17120b;font-weight:900;border-radius:12px;padding:11px 16px}
.sectionTitle{display:flex;justify-content:space-between;align-items:end;margin:24px 0 12px}.sectionTitle h2{margin:0;font-size:20px}.sectionTitle span{color:var(--muted);font-size:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:15px;overflow:hidden;transition:.18s;position:relative}.card:hover{transform:translateY(-3px);border-color:#58496d}
.art{aspect-ratio:6.3/8.8;background:linear-gradient(145deg,#20142f,#0e0b13);display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
.art:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 35%,rgba(217,179,90,.24),transparent 35%),linear-gradient(135deg,transparent 40%,rgba(139,92,246,.16));}
.symbol{font-size:48px;filter:drop-shadow(0 0 18px rgba(217,179,90,.35));z-index:1}.rarity{position:absolute;top:8px;right:8px;background:rgba(0,0,0,.6);border:1px solid #5c4a2b;color:var(--gold2);font-size:9px;padding:4px 6px;border-radius:6px;z-index:2}
.cardInfo{padding:12px}.cardName{font-weight:800;font-size:14px}.meta{font-size:10px;color:var(--muted);margin-top:4px}.cardActions{display:flex;gap:6px;margin-top:10px}.mini{flex:1;border:1px solid var(--line);background:#191621;color:var(--text);padding:7px;border-radius:8px;font-size:11px}.mini:hover{border-color:var(--gold);color:var(--gold2)}
.page{display:none}.page.active{display:block}
.empty{border:1px dashed #3a3345;border-radius:16px;padding:45px;text-align:center;color:var(--muted)}
.deckLayout{display:grid;grid-template-columns:1fr 330px;gap:18px}.deckPanel{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:18px;position:sticky;top:90px;height:max-content}.deckPanel h3{margin-top:0}.deckList{display:flex;flex-direction:column;gap:8px}.deckRow{display:flex;justify-content:space-between;align-items:center;padding:10px;border:1px solid var(--line);border-radius:10px;background:#17141d}.deckRow small{color:var(--muted)}.count{color:var(--gold2);font-weight:800}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.72);display:none;align-items:center;justify-content:center;padding:18px;z-index:50}.modal.open{display:flex}.modalBox{width:min(700px,100%);max-height:90vh;overflow:auto;background:#121019;border:1px solid #3a3046;border-radius:20px;padding:20px}.close{float:right;background:transparent;color:var(--muted);border:0;font-size:24px}.detail{display:grid;grid-template-columns:220px 1fr;gap:22px}.detailArt{aspect-ratio:6.3/8.8;border-radius:14px;background:linear-gradient(145deg,#28143b,#0d0a10);display:flex;align-items:center;justify-content:center;font-size:80px}.skill{padding:13px;border:1px solid var(--line);border-radius:12px;background:var(--panel);margin-top:12px}.skill b{color:var(--gold2);display:block;margin-bottom:5px}.skill p{color:#c4bfca;line-height:1.6;margin:0;font-size:13px}
.toast{position:fixed;right:18px;bottom:18px;background:#201a28;border:1px solid #5a496c;padding:12px 15px;border-radius:12px;display:none;z-index:80}.toast.show{display:block}
@media(max-width:800px){.topbar{padding:0 14px;gap:12px;height:62px}.logo{font-size:14px}.nav button{padding:9px 10px;font-size:12px}.main{padding:16px}.hero{grid-template-columns:1fr}.deckLayout{grid-template-columns:1fr}.deckPanel{position:static}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.detail{grid-template-columns:130px 1fr}.cardInfo{padding:9px}.cardName{font-size:12px}}
</style>
</head>
<body>
<div class="app">
<header class="topbar">
  <div class="logo"><img src="ภาพวาด 20260921.png" alt="STEAL AREA Logo"></div>
  <nav class="nav">
    <button data-page="home" class="active">HOME</button>
    <button data-page="collection">COLLECTION</button>
    <button data-page="deck">DECK</button>
  </nav>
</header>

<main class="main">
<section id="home" class="page active">
  <div class="hero">
    <div class="heroBox"><div class="kicker">WELCOME</div><img src="ภาพวาด 20260921.png" alt="STEAL AREA Logo"><p>คลังการ์ดและระบบจัด Deck สำหรับSOULVAULT CARD GAME </p></div>
    <div class="stats">
      <div class="statBox"><b id="totalCards">0</b><span>CARDS</span></div>
      <div class="statBox"><b id="ownedCards">0</b><span>COLLECTED</span></div>
      <div class="statBox"><b id="deckCount">0</b><span>DECK CARDS</span></div>
      <div class="statBox"><b id="uniqueTypes">0</b><span>CARD TYPES</span></div>
    </div>
  </div>
  <div class="sectionTitle"><h2>Featured Cards</h2><span>การ์ดเด่น</span></div>
  <div id="featured" class="grid"></div>
</section>

<section id="collection" class="page">
  <div class="sectionTitle"><h2>Collection</h2><span id="collectionCount"></span></div>
  <div class="toolbar">
    <input id="search" class="search" placeholder="ค้นหาชื่อการ์ด...">
    <select id="typeFilter" class="filter"><option value="">ทุกประเภท</option><option>Unit</option><option>Skill</option><option>Action</option><option>Item</option></select>
    <select id="rarityFilter" class="filter"><option value="">ทุกระดับ</option><option>Legendary</option><option>Epic</option><option>Rare</option></select>
  </div>
  <div id="collectionGrid" class="grid"></div>
</section>

<section id="deck" class="page">
  <div class="sectionTitle"><h2>Deck Builder</h2><span>สร้าง Deck โดยไม่ต้อง Login</span></div>
  <div class="deckLayout">
    <div id="deckCards" class="grid"></div>
    <aside class="deckPanel">
      <h3>MY DECK</h3>
      <p style="color:var(--muted);font-size:12px">ข้อมูลจะถูกบันทึกไว้ในเครื่องนี้อัตโนมัติ</p>
      <div class="deckList" id="deckList"></div>
      <div style="display:flex;justify-content:space-between;margin-top:15px;border-top:1px solid var(--line);padding-top:15px"><span>Total</span><span class="count" id="deckTotal">0</span></div>
      <button class="primary" style="width:100%;margin-top:12px" onclick="clearDeck()">ล้าง Deck</button>
    </aside>
  </div>
</section>
</main>
</div>

<div id="modal" class="modal" onclick="if(event.target===this)closeModal()">
  <div class="modalBox"><button class="close" onclick="closeModal()">×</button><div id="modalContent"></div></div>
</div>
<div id="toast" class="toast"></div>

<script>
const cards=[
 {id:1,name:"Varethorn",type:"Unit",rarity:"Legendary",icon:"♠",tag:"Thief",skill:"Shadow Heist",desc:"เมื่อเข้าสนาม สามารถเลือกการ์ด 1 ใบในมือคู่แข่งเพื่อเปิดเผยจนจบเทิร์น"},
 {id:2,name:"Scarlet Night",type:"Action",rarity:"Epic",icon:"◆",tag:"Mystic",skill:"Crimson Veil",desc:"เพิ่มพลังให้ Unit 1 ใบ และทำให้ไม่สามารถถูกเลือกโดยเอฟเฟกต์ศัตรูในช่วงสั้น ๆ"},
 {id:3,name:"Soulvault",type:"Skill",rarity:"Rare",icon:"◈",tag:"Soul",skill:"All Time",desc:"เลือกการ์ดจากกองทิ้ง 1 ใบกลับขึ้นมือ ตามเงื่อนไขของสนาม"},
 {id:4,name:"Draconic Fury",type:"Action",rarity:"Epic",icon:"🐉",tag:"Dragon",skill:"Dragon's Wrath",desc:"ปลดปล่อยพลังมังกรเพื่อเพิ่มพลังโจมตีให้ Unit ของคุณ"},
 {id:5,name:"Death Error",type:"Skill",rarity:"Rare",icon:"✦",tag:"Void",skill:"Fatal Glitch",desc:"ยกเลิกเอฟเฟกต์หนึ่งครั้ง แล้วจั่วการ์ดตามเงื่อนไข"},
 {id:6,name:"Forbidden Caress",type:"Skill",rarity:"Epic",icon:"☾",tag:"Dark",skill:"Forbidden Touch",desc:"ผูกมัดเป้าหมายหนึ่งใบ ทำให้ความสามารถบางอย่างหยุดทำงาน"},
 {id:7,name:"Relic Core",type:"Item",rarity:"Legendary",icon:"⬢",tag:"Relic",skill:"Ancient Pulse",desc:"แกนโบราณที่เพิ่มพลังให้ Deck ตาม Core ที่เลือก"},
 {id:8,name:"Soul Shield",type:"Item",rarity:"Rare",icon:"◇",tag:"Defense",skill:"Soul Guard",desc:"สร้างเกราะป้องกันและลดผลกระทบจากเอฟเฟกต์หนึ่งครั้ง"},
 {id:9,name:"Golden Thief",type:"Unit",rarity:"Epic",icon:"♜",tag:"Thief",skill:"Golden Escape",desc:"เคลื่อนย้ายออกจากสถานการณ์อันตรายและเตรียมการโจมตีครั้งต่อไป"},
 {id:10,name:"Neon Phantom",type:"Unit",rarity:"Rare",icon:"☠",tag:"Phantom",skill:"Neon Fade",desc:"หายตัวชั่วคราวและกลับเข้าสนามด้วยเอฟเฟกต์พิเศษ"},
 {id:11,name:"Mirror Break",type:"Action",rarity:"Rare",icon:"◐",tag:"Mirror",skill:"Shattered Reflection",desc:"สะท้อนเอฟเฟกต์ที่เลือกกลับไปยังต้นทาง"},
 {id:12,name:"Crimson Core",type:"Item",rarity:"Legendary",icon:"●",tag:"Core",skill:"Bloodless Power",desc:"เพิ่มพลังให้การ์ดธีม Crimson ตามเงื่อนไขของ Core"}
];

let deck=JSON.parse(localStorage.getItem("stealAreaDeck")||"{}");

function save(){localStorage.setItem("stealAreaDeck",JSON.stringify(deck));renderAll()}
function cardHTML(c, action=true){
 return `<article class="card"><div class="art"><span class="rarity">${c.rarity}</span><span class="symbol">${c.icon}</span></div><div class="cardInfo"><div class="cardName">${c.name}</div><div class="meta">${c.type} · ${c.tag}</div>${action?`<div class="cardActions"><button class="mini" onclick="openCard(${c.id})">ดูการ์ด</button><button class="mini" onclick="addDeck(${c.id})">+ Deck</button></div>`:""}</div></article>`;
}
function renderFeatured(){document.getElementById("featured").innerHTML=cards.slice(0,6).map(c=>cardHTML(c)).join("")}
function renderCollection(){
 let q=document.getElementById("search").value.toLowerCase(),t=document.getElementById("typeFilter").value,r=document.getElementById("rarityFilter").value;
 let list=cards.filter(c=>(!q||c.name.toLowerCase().includes(q)||c.tag.toLowerCase().includes(q))&&(!t||c.type===t)&&(!r||c.rarity===r));
 document.getElementById("collectionCount").textContent=`${list.length} / ${cards.length} ใบ`;
 document.getElementById("collectionGrid").innerHTML=list.length?list.map(c=>cardHTML(c)).join(""):`<div class="empty">ไม่พบการ์ดที่ค้นหา</div>`;
}
function renderDeck(){
 let list=cards.filter(c=>deck[c.id]);
 document.getElementById("deckCards").innerHTML=cards.map(c=>cardHTML(c)).join("");
 document.getElementById("deckList").innerHTML=list.length?list.map(c=>`<div class="deckRow"><div>${c.name}<br><small>${c.type}</small></div><div><span class="count">×${deck[c.id]}</span> <button class="mini" onclick="removeDeck(${c.id})">−</button></div></div>`).join(""):`<div class="empty" style="padding:25px">ยังไม่มีการ์ดใน Deck</div>`;
 document.getElementById("deckTotal").textContent=Object.values(deck).reduce((a,b)=>a+b,0);
}
function addDeck(id){deck[id]=(deck[id]||0)+1;save();toast("เพิ่มการ์ดเข้า Deck แล้ว")}
function removeDeck(id){if(!deck[id])return;if(deck[id]<=1)delete deck[id];else deck[id]--;save()}
function clearDeck(){deck={};save();toast("ล้าง Deck แล้ว")}
function openCard(id){
 let c=cards.find(x=>x.id===id);
 document.getElementById("modalContent").innerHTML=`<div class="detail"><div class="detailArt">${c.icon}</div><div><div class="kicker">${c.type} · ${c.rarity}</div><h1 style="margin:6px 0 4px">${c.name}</h1><div style="color:var(--muted)">${c.tag}</div><div class="skill"><b>${c.skill}</b><p>${c.desc}</p></div><button class="primary" style="margin-top:15px" onclick="addDeck(${c.id});closeModal()">เพิ่มเข้า Deck</button></div></div>`;
 document.getElementById("modal").classList.add("open");
}
function closeModal(){document.getElementById("modal").classList.remove("open")}
function toast(s){let x=document.getElementById("toast");x.textContent=s;x.classList.add("show");setTimeout(()=>x.classList.remove("show"),1400)}
function renderAll(){
 document.getElementById("totalCards").textContent=cards.length;
 document.getElementById("ownedCards").textContent=cards.length;
 document.getElementById("deckCount").textContent=Object.values(deck).reduce((a,b)=>a+b,0);
 document.getElementById("uniqueTypes").textContent=new Set(cards.map(c=>c.type)).size;
 renderFeatured();renderCollection();renderDeck();
}
document.querySelectorAll(".nav button").forEach(btn=>btn.onclick=()=>{
 document.querySelectorAll(".nav button").forEach(x=>x.classList.remove("active"));btn.classList.add("active");
 document.querySelectorAll(".page").forEach(x=>x.classList.remove("active"));document.getElementById(btn.dataset.page).classList.add("active");
 location.hash=btn.dataset.page;
});
["search","typeFilter","rarityFilter"].forEach(id=>document.getElementById(id).addEventListener("input",renderCollection));
renderAll();
if(location.hash){let p=location.hash.slice(1);let b=document.querySelector(`[data-page="${p}"]`);if(b)b.click()}
</script>
</body>
</html>
